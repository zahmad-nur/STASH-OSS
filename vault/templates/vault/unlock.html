{% extends "plain.html" %}
{% block title %}Unlock STASH{% endblock %}
{% block body %}
<h1>Unlock STASH</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" class="stack">
  {% csrf_token %}
  <label>Passphrase<input type="password" name="passphrase" required autofocus autocomplete="current-password"></label>
  <button class="btn primary" type="submit">Unlock</button>
</form>
<p class="muted"><a href="/recover">Forgot your passphrase? Use your recovery key.</a></p>
{% endblock %}
